name: Claude Issue Triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Claude Code on new issue
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            A new GitHub issue was just opened on this repo (a single-file
            static HTML game, index.html). Read the issue title and body.

            - If it's a clear, scoped bug report or feature request you can
              address by editing index.html, make the change and open a
              pull request that fixes/implements it, referencing this issue.
            - If it's unclear, not reproducible, or too broad, leave a
              comment on the issue asking clarifying questions instead of
              making changes.
            - Do not modify anything unrelated to the issue.
